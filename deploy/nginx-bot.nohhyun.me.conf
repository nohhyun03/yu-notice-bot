# Put these in the HTTPS (listen 443) server block of /etc/nginx/sites-available/bot.nohhyun.me,
# replacing the old "root" line and "location /" block.
root /srv/yu-notice-bot/web;
index index.html;

location / {
    try_files $uri $uri/ =404;
}

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
}
